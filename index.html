<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meowl</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    #meowl-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #status-banner {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 5;
      box-sizing: border-box;
      width: 100%;
      font-size: 24px;
      color: red;
      font-weight: bold;
      padding: 20px;
      text-align: center;
      background: yellow;
    }

    #floating-meowls {
      position: fixed;
      inset: 0;
      z-index: 3;
      overflow: hidden;
      pointer-events: none;
    }

    #floating-meowls img {
      position: absolute;
      display: block;
      height: auto;
      object-fit: contain;
      animation: meowl-pop 450ms ease-out both;
    }

    @keyframes meowl-pop {
      from {
        opacity: 0.2;
        transform: scale(0.1);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

  </style>
</head>
<body>
  <div id="status-banner">free music wow</div>
  <img id="meowl-image" src="meowl.png" alt="Meowl">
  <audio id="meowl-audio" src="meowl.mp3" loop></audio>
  <audio id="meow-sound" src="meow.mp3" preload="auto"></audio>
  <audio id="admin-audio" src="meowlwow.mp3" loop preload="auto"></audio>
  <div id="floating-meowls" aria-hidden="true"></div>
  <script>
    const audio = document.getElementById("meowl-audio");
    const image = document.getElementById("meowl-image");
    const meowSound = document.getElementById("meow-sound");
    const adminAudio = document.getElementById("admin-audio");
    const banner = document.getElementById("status-banner");
    const floatingMeowls = document.getElementById("floating-meowls");
    const rotatingMessages = [
      "free music meowl",
      "free musics",
      "free meowl music",
      "＼(＾▽＾)／",
      "yay",
      "lala",
      "lLALALALLALALAL",
      "lalalalalalll",
      "allalalallalal",
      "music by meowl made with love by meowl",
      "we love meowls yay",
      "we love meowls"
    ];
    const maxFloatingMeowls = 20;
    let imageResetTimeout;
    let textTimer;
    let countdownTimer;
    let effectTimer;
    let spawnTimer;
    let countdownActive = false;
    let adminEventActive = false;
    let adminAudioWasPlaying = false;
    let lastMessage = "free music wow";
    let floatingMeowlMotion = [];
    let animationFrameId;
    let lastAnimationFrame = 0;

    image.addEventListener("click", () => {
      if (adminEventActive) return;

      if (audio.paused) {
        audio.play();
        return;
      }

      image.src = "meowl2.png";
      meowSound.currentTime = 0;
      meowSound.play();
      clearTimeout(imageResetTimeout);
      imageResetTimeout = setTimeout(() => {
        image.src = "meowl.png";
      }, 300);
    });

    function showRandomMessage() {
      let message;
      do {
        message = rotatingMessages[Math.floor(Math.random() * rotatingMessages.length)];
      } while (message === lastMessage);

      lastMessage = message;
      banner.innerText = message;
    }

    function beginAdminCountdown() {
      countdownActive = true;
      const countdownEndsAt = Date.now() + 60000;

      function updateCountdown() {
        const secondsLeft = Math.ceil((countdownEndsAt - Date.now()) / 1000);
        if (secondsLeft <= 0) {
          startAdminEvent();
          return;
        }

        banner.innerText = secondsLeft === 60
          ? "meowl admin abuse in 1 minute"
          : `meowl admin abuse in ${secondsLeft} seconds`;
        countdownTimer = setTimeout(updateCountdown, 1000);
      }

      updateCountdown();
    }

    function addFloatingMeowl() {
      const meowl = document.createElement("img");
      const size = 55 + Math.random() * 95;
      const width = Math.round(size);
      const height = Math.round(size * 850 / 770);
      const x = Math.random() * Math.max(0, window.innerWidth - width);
      const y = Math.random() * Math.max(0, window.innerHeight - height);
      meowl.src = "meowl3.png";
      meowl.alt = "";
      meowl.style.width = `${width}px`;
      meowl.style.height = `${height}px`;
      meowl.style.left = `${x}px`;
      meowl.style.top = `${y}px`;
      floatingMeowls.appendChild(meowl);

      floatingMeowlMotion.push({
        element: meowl,
        x,
        y,
        width,
        height,
        vx: (Math.random() < 0.5 ? -1 : 1) * (2 + Math.random() * 3),
        vy: (Math.random() < 0.5 ? -1 : 1) * (2 + Math.random() * 3)
      });
    }

    function moveFloatingMeowls(timestamp) {
      const frameScale = lastAnimationFrame
        ? Math.min((timestamp - lastAnimationFrame) / 16.67, 3)
        : 1;
      lastAnimationFrame = timestamp;

      floatingMeowlMotion.forEach((meowl) => {
        const maxX = Math.max(0, window.innerWidth - meowl.width);
        const maxY = Math.max(0, window.innerHeight - meowl.height);
        meowl.x += meowl.vx * frameScale;
        meowl.y += meowl.vy * frameScale;

        if (meowl.x <= 0 || meowl.x >= maxX) {
          meowl.x = Math.max(0, Math.min(meowl.x, maxX));
          meowl.vx *= -1;
        }
        if (meowl.y <= 0 || meowl.y >= maxY) {
          meowl.y = Math.max(0, Math.min(meowl.y, maxY));
          meowl.vy *= -1;
        }

        meowl.element.style.left = `${meowl.x}px`;
        meowl.element.style.top = `${meowl.y}px`;
      });

      if (adminEventActive) animationFrameId = requestAnimationFrame(moveFloatingMeowls);
    }

    function startAdminEvent() {
      countdownActive = false;
      adminEventActive = true;
      adminAudioWasPlaying = !audio.paused;
      audio.pause();
      adminAudio.currentTime = 0;
      adminAudio.play();
      banner.innerText = "meowl admin abuse!";
      lastAnimationFrame = 0;
      animationFrameId = requestAnimationFrame(moveFloatingMeowls);

      let floatingCount = 0;
      function burst() {
        for (let i = 0; i < 4 && floatingCount < maxFloatingMeowls; i += 1) {
          addFloatingMeowl();
          floatingCount += 1;
        }
        if (floatingCount >= maxFloatingMeowls) clearInterval(spawnTimer);
      }

      burst();
      spawnTimer = setInterval(burst, 700);
      effectTimer = setTimeout(endAdminEvent, 120000);
    }

    function endAdminEvent() {
      clearInterval(spawnTimer);
      cancelAnimationFrame(animationFrameId);
      floatingMeowlMotion = [];
      floatingMeowls.replaceChildren();
      adminAudio.pause();
      adminAudio.currentTime = 0;
      adminEventActive = false;
      showRandomMessage();
      if (adminAudioWasPlaying) audio.play();
    }

    textTimer = setInterval(() => {
      if (countdownActive || adminEventActive) return;
      showRandomMessage();
      if (Math.random() < 0.05) beginAdminCountdown();
    }, 5000);
  </script>
</body>
</html>
