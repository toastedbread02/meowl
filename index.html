<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meowl</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

  </style>
</head>
<body>
  <img src="meowl.png" alt="Meowl">
  <audio id="meowl-audio" src="meowl.mp3" autoplay loop></audio>
  <script>
    const audio = document.getElementById("meowl-audio");

    audio.play().catch(() => {
      if (window.confirm("May this page play the looping sound?")) {
        audio.play().catch(() => {});
      }
    });
  </script>
</body>
</html>
