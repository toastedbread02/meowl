<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meowl</title>
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    * {
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    #meowl-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #status-banner {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 5;
      box-sizing: border-box;
      width: 100%;
      font-size: 24px;
      color: red;
      font-weight: bold;
      padding: 20px;
      text-align: center;
      background: yellow;
    }

    #event-menu {
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 8;
      display: grid;
      gap: 10px;
      padding: 8px;
      border: 1px solid #777;
      background: white;
      transform: translate(-50%, -50%);
    }

    #event-backdrop {
      position: fixed;
      inset: 0;
      z-index: 7;
      background: rgba(0, 0, 0, 0.65);
    }

    #event-backdrop[hidden] {
      display: none;
    }

    #event-menu[hidden] {
      display: none;
    }

    #event-menu button {
      display: block;
      width: 100%;
    }

    #meowl-image.disco-mode {
      animation: meowl-disco 2s linear infinite;
    }

    #floating-meowls.disco-mode {
      animation: meowl-rainbow 2s linear infinite;
      will-change: filter;
    }

    @keyframes meowl-disco {
      to { filter: hue-rotate(360deg); }
    }

    @keyframes meowl-rainbow {
      to { filter: hue-rotate(360deg); }
    }

    #floating-meowls {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

  </style>
</head>
<body>
  <div id="status-banner">free music wow</div>
  <div id="event-backdrop" hidden></div>
  <section id="event-menu" aria-label="Event menu" hidden>
    <button type="button" data-trigger-event="disco">Start Disco</button>
    <button type="button" data-trigger-event="admin">Start Admin Abuse</button>
  </section>
  <img id="meowl-image" src="meowl.png" alt="Meowl">
  <audio id="meowl-audio" src="meowl.mp3" loop></audio>
  <audio id="meow-sound" src="meow.mp3" preload="auto"></audio>
  <audio id="admin-audio" src="meowlwow.mp3" loop preload="auto"></audio>
  <audio id="disco-audio" src="disco.mp3" preload="auto"></audio>
  <canvas id="floating-meowls" aria-hidden="true"></canvas>
  <script>
    const audio = document.getElementById("meowl-audio");
    const image = document.getElementById("meowl-image");
    const meowSound = document.getElementById("meow-sound");
    const adminAudio = document.getElementById("admin-audio");
    const discoAudio = document.getElementById("disco-audio");
    const banner = document.getElementById("status-banner");
    const eventBackdrop = document.getElementById("event-backdrop");
    const eventMenu = document.getElementById("event-menu");
    const floatingMeowls = document.getElementById("floating-meowls");
    const floatingContext = floatingMeowls.getContext("2d", { alpha: true });
    const floatingSprite = new Image();
    floatingSprite.src = "meowl3.png";
    const rotatingMessages = [
      "free music meowl",
      "free musics",
      "free meowl music",
      "＼(＾▽＾)／",
      "yay",
      "lala",
      "lLALALALLALALAL",
      "lalalalalalll",
      "allalalallalal",
      "music by meowl made with love by meowl",
      "we love meowls yay",
      "we love meowls"
    ];
    const maxFloatingMeowls = 20;
    const discoCopiesPerCollision = 60;
    const discoBatchCooldown = 300;
    let imageResetTimeout;
    let textTimer;
    let countdownTimer;
    let effectTimer;
    let spawnTimer;
    let countdownActive = false;
    let discoCountdownActive = false;
    let adminEventActive = false;
    let adminAudioWasPlaying = false;
    let discoActive = false;
    let discoTimer;
    let discoRainbowDelay = "0ms";
    let lastMessage = "free music wow";
    let floatingMeowlMotion = [];
    let activeCollisionPairs = new Set();
    let lastCollisionBurstAt = -Infinity;
    let lastCollisionCheckAt = -Infinity;
    let animationFrameId;
    let lastAnimationFrame = 0;
    let bannerClickCount = 0;

    function resizeFloatingCanvas() {
      const ratio = Math.min(window.devicePixelRatio || 1, 1.5);
      floatingMeowls.width = Math.round(window.innerWidth * ratio);
      floatingMeowls.height = Math.round(window.innerHeight * ratio);
      floatingContext.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    resizeFloatingCanvas();
    window.addEventListener("resize", resizeFloatingCanvas);

    function countBannerClick() {
      bannerClickCount += 1;
      if (bannerClickCount === 3) {
        bannerClickCount = 0;
        eventMenu.hidden = false;
        eventBackdrop.hidden = false;
      }
    }

    banner.addEventListener("click", countBannerClick);
    eventBackdrop.addEventListener("click", () => {
      eventMenu.hidden = true;
      eventBackdrop.hidden = true;
    });

    eventMenu.addEventListener("click", (event) => {
      const trigger = event.target.closest("[data-trigger-event]");
      if (!trigger) return;

      eventMenu.hidden = true;
      eventBackdrop.hidden = true;
      clearTimeout(countdownTimer);
      countdownActive = false;
      discoCountdownActive = false;
      if (discoActive) endDiscoEvent();
      if (adminEventActive) endAdminEvent();

      if (trigger.dataset.triggerEvent === "disco") startDiscoEvent();
      else startAdminEvent();
    });

    image.addEventListener("click", () => {
      if (adminEventActive) return;

      if (audio.paused) {
        audio.play();
        return;
      }

      triggerMeowReaction();
    });

    function triggerMeowReaction() {
      image.src = "meowl2.png";
      meowSound.currentTime = 0;
      meowSound.playbackRate = 0.7 + Math.random() * 0.6;
      meowSound.preservesPitch = false;
      meowSound.webkitPreservesPitch = false;
      meowSound.mozPreservesPitch = false;
      meowSound.play();
      clearTimeout(imageResetTimeout);
      imageResetTimeout = setTimeout(() => {
        image.src = "meowl.png";
      }, 300);
    }

    function canStartEvent() {
      return !countdownActive && !discoCountdownActive && !adminEventActive && !discoActive;
    }

    function startDiscoEvent() {
      if (!canStartEvent()) return;
      discoActive = true;
      discoAudio.currentTime = 0;
      discoAudio.play();
      discoRainbowDelay = `${-(performance.now() % 2000)}ms`;
      image.classList.add("disco-mode");
      image.style.animationDelay = discoRainbowDelay;
      floatingMeowls.classList.add("disco-mode");
      floatingMeowls.style.animationDelay = discoRainbowDelay;
      banner.innerText = "meowl disco mode!";
      floatingContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
      floatingMeowlMotion = [];
      activeCollisionPairs.clear();
      lastCollisionBurstAt = -Infinity;
      lastCollisionCheckAt = -Infinity;
      for (let i = 0; i < 2; i += 1) addFloatingMeowl();
      lastAnimationFrame = 0;
      animationFrameId = requestAnimationFrame(moveFloatingMeowls);
      discoTimer = setTimeout(endDiscoEvent, 60000);
    }

    function endDiscoEvent() {
      clearTimeout(discoTimer);
      image.classList.remove("disco-mode");
      image.style.removeProperty("animation-delay");
      floatingMeowls.classList.remove("disco-mode");
      floatingMeowls.style.removeProperty("animation-delay");
      discoActive = false;
      cancelAnimationFrame(animationFrameId);
      floatingMeowlMotion = [];
      activeCollisionPairs.clear();
      floatingContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
      discoAudio.pause();
      discoAudio.currentTime = 0;
      showRandomMessage();
    }

    function showRandomMessage() {
      let message;
      do {
        message = rotatingMessages[Math.floor(Math.random() * rotatingMessages.length)];
      } while (message === lastMessage);

      lastMessage = message;
      banner.innerText = message;
    }

    function beginAdminCountdown() {
      countdownActive = true;
      const countdownEndsAt = Date.now() + 60000;

      function updateCountdown() {
        const secondsLeft = Math.ceil((countdownEndsAt - Date.now()) / 1000);
        if (secondsLeft <= 0) {
          startAdminEvent();
          return;
        }

        banner.innerText = secondsLeft === 60
          ? "meowl admin abuse in 1 minute"
          : `meowl admin abuse in ${secondsLeft} seconds`;
        countdownTimer = setTimeout(updateCountdown, 1000);
      }

      updateCountdown();
    }

    function beginDiscoCountdown() {
      discoCountdownActive = true;
      const countdownEndsAt = Date.now() + 60000;

      function updateCountdown() {
        const secondsLeft = Math.ceil((countdownEndsAt - Date.now()) / 1000);
        if (secondsLeft <= 0) {
          discoCountdownActive = false;
          startDiscoEvent();
          return;
        }

        banner.innerText = secondsLeft === 60
          ? "disco in 1 minute"
          : `disco in ${secondsLeft} seconds`;
        countdownTimer = setTimeout(updateCountdown, 1000);
      }

      updateCountdown();
    }

    function addFloatingMeowl(options = {}) {
      const size = options.size ?? 55 + Math.random() * 95;
      const width = Math.round(size);
      const height = Math.round(size * 850 / 770);
      const maxX = Math.max(0, window.innerWidth - width);
      const maxY = Math.max(0, window.innerHeight - height);
      const x = Math.max(0, Math.min(options.x ?? Math.random() * maxX, maxX));
      const y = Math.max(0, Math.min(options.y ?? Math.random() * maxY, maxY));
      floatingMeowlMotion.push({
        x,
        y,
        width,
        height,
        vx: (Math.random() < 0.5 ? -1 : 1) * (2 + Math.random() * 3),
        vy: (Math.random() < 0.5 ? -1 : 1) * (2 + Math.random() * 3),
        ...(options.velocity || {})
      });
    }

    function moveFloatingMeowls(timestamp) {
      const motionCount = floatingMeowlMotion.length;
      const frameInterval = motionCount > 5000 ? 1000 / 15 : motionCount > 1000 ? 1000 / 30 : 0;
      if (frameInterval && timestamp - lastAnimationFrame < frameInterval) {
        animationFrameId = requestAnimationFrame(moveFloatingMeowls);
        return;
      }
      const frameScale = lastAnimationFrame
        ? Math.min((timestamp - lastAnimationFrame) / 16.67, 5)
        : 1;
      lastAnimationFrame = timestamp;

      for (let i = 0; i < motionCount; i += 1) {
        const meowl = floatingMeowlMotion[i];
        const maxX = Math.max(0, window.innerWidth - meowl.width);
        const maxY = Math.max(0, window.innerHeight - meowl.height);
        meowl.x += meowl.vx * frameScale;
        meowl.y += meowl.vy * frameScale;

        if (meowl.x <= 0 || meowl.x >= maxX) {
          meowl.x = Math.max(0, Math.min(meowl.x, maxX));
          meowl.vx *= -1;
        }
        if (meowl.y <= 0 || meowl.y >= maxY) {
          meowl.y = Math.max(0, Math.min(meowl.y, maxY));
          meowl.vy *= -1;
        }

      }

      floatingContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
      if (floatingSprite.complete && floatingSprite.naturalWidth) {
        for (const meowl of floatingMeowlMotion) {
          floatingContext.drawImage(floatingSprite, meowl.x, meowl.y, meowl.width, meowl.height);
        }
      }

      if (discoActive && timestamp - lastCollisionCheckAt >= 100) {
        lastCollisionCheckAt = timestamp;
        const collisionsThisFrame = new Set();
        const countAtFrameStart = floatingMeowlMotion.length;
        const cellSize = 256;
        const grid = new Map();

        for (let i = 0; i < countAtFrameStart; i += 1) {
          const meowl = floatingMeowlMotion[i];
          const cellX = Math.floor((meowl.x + meowl.width / 2) / cellSize);
          const cellY = Math.floor((meowl.y + meowl.height / 2) / cellSize);
          const key = `${cellX}:${cellY}`;
          if (!grid.has(key)) grid.set(key, []);
          grid.get(key).push(i);
        }

        for (let i = 0; i < countAtFrameStart; i += 1) {
          const first = floatingMeowlMotion[i];
          const cellX = Math.floor((first.x + first.width / 2) / cellSize);
          const cellY = Math.floor((first.y + first.height / 2) / cellSize);
          for (let neighborX = cellX - 1; neighborX <= cellX + 1; neighborX += 1) {
            for (let neighborY = cellY - 1; neighborY <= cellY + 1; neighborY += 1) {
              const neighbors = grid.get(`${neighborX}:${neighborY}`) || [];
              for (const j of neighbors) {
                if (j <= i) continue;
                const second = floatingMeowlMotion[j];
                const overlaps = Math.abs(first.x + first.width / 2 - second.x - second.width / 2)
                    < (first.width + second.width) / 2
                  && Math.abs(first.y + first.height / 2 - second.y - second.height / 2)
                    < (first.height + second.height) / 2;
                if (!overlaps) continue;

                const pairKey = `${i}:${j}`;
                collisionsThisFrame.add(pairKey);
                if (activeCollisionPairs.has(pairKey)) continue;

                const centerX = (first.x + first.width / 2 + second.x + second.width / 2) / 2;
                const centerY = (first.y + first.height / 2 + second.y + second.height / 2) / 2;
                if (timestamp - lastCollisionBurstAt < discoBatchCooldown) continue;
                lastCollisionBurstAt = timestamp;
                const parentSize = (first.width + second.width) / 2;
                const firstCopyAngle = Math.random() * Math.PI * 2;
                for (let copy = 0; copy < discoCopiesPerCollision; copy += 1) {
                  const size = Math.max(24, Math.min(190, parentSize * (0.55 + Math.random() * 0.9)));
                  const angle = firstCopyAngle + copy * Math.PI * 2 / discoCopiesPerCollision;
                  const speed = 3 + Math.random() * 3;
                  const burstRadius = parentSize * 0.75 + size * 0.75;
                  addFloatingMeowl({
                    x: centerX - size / 2 + Math.cos(angle) * burstRadius,
                    y: centerY - size * 850 / 770 / 2 + Math.sin(angle) * burstRadius,
                    size,
                    velocity: {
                      vx: Math.cos(angle) * speed,
                      vy: Math.sin(angle) * speed
                    }
                  });
                }
              }
            }
          }
        }

        activeCollisionPairs = collisionsThisFrame;
      }

      if (adminEventActive || discoActive) {
        animationFrameId = requestAnimationFrame(moveFloatingMeowls);
      }
    }

    function startAdminEvent() {
      countdownActive = false;
      adminEventActive = true;
      adminAudioWasPlaying = !audio.paused;
      audio.pause();
      adminAudio.currentTime = 0;
      adminAudio.play();
      banner.innerText = "meowl admin abuse!";
      lastAnimationFrame = 0;
      animationFrameId = requestAnimationFrame(moveFloatingMeowls);

      let floatingCount = 0;
      function burst() {
        for (let i = 0; i < 4 && floatingCount < maxFloatingMeowls; i += 1) {
          addFloatingMeowl();
          floatingCount += 1;
        }
        if (floatingCount >= maxFloatingMeowls) clearInterval(spawnTimer);
      }

      burst();
      spawnTimer = setInterval(burst, 700);
      effectTimer = setTimeout(endAdminEvent, 120000);
    }

    function endAdminEvent() {
      clearInterval(spawnTimer);
      clearTimeout(effectTimer);
      cancelAnimationFrame(animationFrameId);
      floatingMeowlMotion = [];
      floatingContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
      adminAudio.pause();
      adminAudio.currentTime = 0;
      adminEventActive = false;
      showRandomMessage();
      if (adminAudioWasPlaying) audio.play();
    }

    textTimer = setInterval(() => {
      if (countdownActive || discoCountdownActive || adminEventActive || discoActive) return;
      showRandomMessage();
      const chance = Math.random();
      if (chance < 0.01) beginAdminCountdown();
      else if (chance < 0.02) beginDiscoCountdown();
    }, 5000);
  </script>
</body>
</html>
