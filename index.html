<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meowl</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    #meowl-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #status-banner {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 5;
      box-sizing: border-box;
      width: 100%;
      font-size: 24px;
      color: red;
      font-weight: bold;
      padding: 20px;
      text-align: center;
      background: yellow;
    }

    #admin-toggle {
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 8;
      width: 34px;
      height: 34px;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 50%;
      color: white;
      background: rgba(0, 0, 0, 0.45);
      font-size: 18px;
      cursor: pointer;
      opacity: 0.35;
    }

    #admin-toggle:hover,
    #admin-toggle:focus-visible {
      opacity: 1;
    }

    #admin-panel {
      position: fixed;
      right: 12px;
      bottom: 54px;
      z-index: 8;
      width: min(260px, calc(100vw - 24px));
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #777;
      border-radius: 10px;
      color: white;
      background: rgba(20, 20, 20, 0.95);
      font: 14px sans-serif;
    }

    #admin-panel[hidden] {
      display: none;
    }

    #admin-panel h2 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    #admin-panel button[data-event] {
      display: block;
      width: 100%;
      margin-top: 7px;
      padding: 8px;
      border: 0;
      border-radius: 6px;
      text-align: left;
      cursor: pointer;
    }

    .event-warning {
      margin: 10px 2px 0;
      color: #ffd66b;
      font-size: 12px;
      line-height: 1.4;
    }

    #meowl-image.disco-mode {
      animation: meowl-disco 2s linear infinite;
    }

    #floating-meowls.disco-mode {
      animation: meowl-rainbow 2s linear infinite;
      will-change: filter;
    }

    @keyframes meowl-disco {
      to { filter: hue-rotate(360deg); }
    }

    @keyframes meowl-rainbow {
      to { filter: hue-rotate(360deg); }
    }

    #floating-meowls {
      position: fixed;
      inset: 0;
      z-index: 3;
      overflow: hidden;
      pointer-events: none;
    }

    #floating-meowls img {
      position: absolute;
      left: 0;
      top: 0;
      display: block;
      height: auto;
      object-fit: contain;
      animation: meowl-pop 450ms ease-out both;
    }

    @keyframes meowl-pop {
      from {
        opacity: 0.2;
        scale: 0.1;
      }
      100% {
        opacity: 1;
        scale: 1;
      }
    }

    #platformer {
      position: fixed;
      inset: 0;
      z-index: 10;
      overflow: hidden;
      color: white;
      background: #17254a;
      font-family: system-ui, sans-serif;
    }

    #platformer[hidden] {
      display: none;
    }

    #platformer-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .platformer-title,
    #platformer-close {
      position: absolute;
      top: 14px;
      z-index: 1;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      background: rgba(12, 20, 45, 0.75);
      backdrop-filter: blur(6px);
    }

    .platformer-title {
      left: 14px;
      pointer-events: none;
    }

    .platformer-title strong,
    .platformer-title span {
      display: block;
    }

    .platformer-title span {
      margin-top: 4px;
      color: #d7e6ff;
      font-size: 13px;
    }

    #platformer-close {
      right: 14px;
      color: white;
      cursor: pointer;
    }

    .platformer-touch-controls {
      position: absolute;
      right: 18px;
      bottom: 18px;
      left: 18px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }

    .platformer-touch-controls button {
      min-width: 62px;
      min-height: 56px;
      margin: 4px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 14px;
      color: white;
      background: rgba(12, 20, 45, 0.7);
      font-size: 22px;
      touch-action: none;
      pointer-events: auto;
    }

    .platformer-touch-group {
      display: flex;
    }

  </style>
</head>
<body>
  <div id="status-banner">free music wow</div>
  <img id="meowl-image" src="meowl.png" alt="Meowl">
  <audio id="meowl-audio" src="meowl.mp3" loop></audio>
  <audio id="meow-sound" src="meow.mp3" preload="auto"></audio>
  <audio id="admin-audio" src="meowlwow.mp3" loop preload="auto"></audio>
  <div id="floating-meowls" aria-hidden="true"></div>
  <button id="admin-toggle" type="button" aria-label="Open secret event panel" aria-expanded="false" title="">⚙</button>
  <section id="admin-panel" aria-label="Secret event panel" hidden>
    <h2>Meowl event panel</h2>
    <button type="button" data-event="countdown">Start admin countdown</button>
    <button type="button" data-event="admin-now">Start admin event now</button>
    <button type="button" data-event="meow">Play meow reaction</button>
    <button type="button" data-event="disco">Disco meowl (1 minute)</button>
    <button type="button" data-event="platformer">Play Meowl platformer</button>
    <p class="event-warning">Warning: Disco mode has no image limit. Collisions are paced to reduce lag, but many images may still slow your browser.</p>
  </section>
  <section id="platformer" aria-label="Meowl platformer" hidden>
    <canvas id="platformer-canvas"></canvas>
    <div class="platformer-title">
      <strong>Meowl Run</strong>
      <span>Move: ← → or A/D · Jump: Space / ↑</span>
    </div>
    <button id="platformer-close" type="button">Close ×</button>
    <div class="platformer-touch-controls" aria-label="Touch controls">
      <div class="platformer-touch-group">
        <button type="button" data-game-key="left" aria-label="Move left">◀</button>
        <button type="button" data-game-key="right" aria-label="Move right">▶</button>
      </div>
      <button type="button" data-game-key="jump" aria-label="Jump">Jump</button>
    </div>
  </section>
  <script>
    const audio = document.getElementById("meowl-audio");
    const image = document.getElementById("meowl-image");
    const meowSound = document.getElementById("meow-sound");
    const adminAudio = document.getElementById("admin-audio");
    const banner = document.getElementById("status-banner");
    const floatingMeowls = document.getElementById("floating-meowls");
    const adminToggle = document.getElementById("admin-toggle");
    const adminPanel = document.getElementById("admin-panel");
    const platformer = document.getElementById("platformer");
    const platformerCanvas = document.getElementById("platformer-canvas");
    const platformerContext = platformerCanvas.getContext("2d");
    const platformerSprite = new Image();
    platformerSprite.src = "meowl.png";
    const gameKeys = new Set();
    const rotatingMessages = [
      "free music meowl",
      "free musics",
      "free meowl music",
      "＼(＾▽＾)／",
      "yay",
      "lala",
      "lLALALALLALALAL",
      "lalalalalalll",
      "allalalallalal",
      "music by meowl made with love by meowl",
      "we love meowls yay",
      "we love meowls"
    ];
    const maxFloatingMeowls = 20;
    const discoCopiesPerCollision = 30;
    let imageResetTimeout;
    let textTimer;
    let countdownTimer;
    let effectTimer;
    let spawnTimer;
    let countdownActive = false;
    let adminEventActive = false;
    let adminAudioWasPlaying = false;
    let discoActive = false;
    let discoTimer;
    let discoRainbowDelay = "0ms";
    let lastMessage = "free music wow";
    let floatingMeowlMotion = [];
    let activeCollisionPairs = new Set();
    let lastCollisionBurstAt = -Infinity;
    let animationFrameId;
    let lastAnimationFrame = 0;
    let platformerActive = false;
    let platformerFrameId;
    let platformerLastFrame = 0;
    let platformerWidth = 0;
    let platformerHeight = 0;
    let platformerWorldWidth = 0;
    let platformerCameraX = 0;
    let platformerPlatforms = [];
    let platformerWon = false;
    let jumpQueued = false;
    const platformerPlayer = {
      x: 0,
      y: 0,
      width: 42,
      height: 46,
      velocityY: 0,
      onGround: false,
      checkpointX: 24
    };

    image.addEventListener("click", () => {
      if (adminEventActive) return;

      if (audio.paused) {
        audio.play();
        return;
      }

      triggerMeowReaction();
    });

    function triggerMeowReaction() {
      image.src = "meowl2.png";
      meowSound.currentTime = 0;
      meowSound.play();
      clearTimeout(imageResetTimeout);
      imageResetTimeout = setTimeout(() => {
        image.src = "meowl.png";
      }, 300);
    }

    function canStartEvent() {
      return !countdownActive && !adminEventActive && !discoActive;
    }

    function startDiscoEvent() {
      if (!canStartEvent()) return;
      discoActive = true;
      discoRainbowDelay = `${-(performance.now() % 2000)}ms`;
      image.classList.add("disco-mode");
      image.style.animationDelay = discoRainbowDelay;
      floatingMeowls.classList.add("disco-mode");
      floatingMeowls.style.animationDelay = discoRainbowDelay;
      banner.innerText = "meowl disco mode!";
      floatingMeowls.replaceChildren();
      floatingMeowlMotion = [];
      activeCollisionPairs.clear();
      lastCollisionBurstAt = -Infinity;
      for (let i = 0; i < 2; i += 1) addFloatingMeowl();
      lastAnimationFrame = 0;
      animationFrameId = requestAnimationFrame(moveFloatingMeowls);
      discoTimer = setTimeout(() => {
        image.classList.remove("disco-mode");
        image.style.removeProperty("animation-delay");
        floatingMeowls.classList.remove("disco-mode");
        floatingMeowls.style.removeProperty("animation-delay");
        discoActive = false;
        cancelAnimationFrame(animationFrameId);
        floatingMeowlMotion = [];
        activeCollisionPairs.clear();
        floatingMeowls.replaceChildren();
        showRandomMessage();
      }, 60000);
    }

    adminToggle.addEventListener("click", () => {
      adminPanel.hidden = !adminPanel.hidden;
      adminToggle.setAttribute("aria-expanded", String(!adminPanel.hidden));
    });

    adminPanel.addEventListener("click", (event) => {
      const eventButton = event.target.closest("[data-event]");
      if (!eventButton) return;

      if (eventButton.dataset.event === "meow") {
        triggerMeowReaction();
      } else if (eventButton.dataset.event === "disco") {
        startDiscoEvent();
      } else if (eventButton.dataset.event === "countdown" && canStartEvent()) {
        beginAdminCountdown();
      } else if (eventButton.dataset.event === "admin-now" && canStartEvent()) {
        startAdminEvent();
      } else if (eventButton.dataset.event === "platformer") {
        startPlatformer();
      }

      adminPanel.hidden = true;
      adminToggle.setAttribute("aria-expanded", "false");
    });

    document.getElementById("platformer-close").addEventListener("click", stopPlatformer);
    platformerCanvas.addEventListener("click", () => {
      if (platformerWon) resetPlatformerPlayer();
    });

    window.addEventListener("keydown", (event) => {
      if (!platformerActive) return;
      const key = event.key.toLowerCase();
      if (["arrowleft", "arrowright", "arrowup", " "].includes(key)) event.preventDefault();
      if (key === "arrowleft" || key === "a") gameKeys.add("left");
      if (key === "arrowright" || key === "d") gameKeys.add("right");
      if (key === "arrowup" || key === "w" || key === " ") jumpQueued = true;
    });

    window.addEventListener("keyup", (event) => {
      const key = event.key.toLowerCase();
      if (key === "arrowleft" || key === "a") gameKeys.delete("left");
      if (key === "arrowright" || key === "d") gameKeys.delete("right");
    });

    window.addEventListener("blur", () => gameKeys.clear());

    document.querySelectorAll("[data-game-key]").forEach((button) => {
      const key = button.dataset.gameKey;
      button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        button.setPointerCapture(event.pointerId);
        if (key === "jump") jumpQueued = true;
        else gameKeys.add(key);
      });
      const release = () => gameKeys.delete(key);
      button.addEventListener("pointerup", release);
      button.addEventListener("pointercancel", release);
      button.addEventListener("lostpointercapture", release);
    });

    window.addEventListener("resize", () => {
      if (!platformerActive) return;
      sizePlatformerCanvas();
      buildPlatformerLevel();
      resetPlatformerPlayer();
    });

    function showRandomMessage() {
      let message;
      do {
        message = rotatingMessages[Math.floor(Math.random() * rotatingMessages.length)];
      } while (message === lastMessage);

      lastMessage = message;
      banner.innerText = message;
    }

    function sizePlatformerCanvas() {
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      platformerWidth = window.innerWidth;
      platformerHeight = window.innerHeight;
      platformerCanvas.width = Math.round(platformerWidth * pixelRatio);
      platformerCanvas.height = Math.round(platformerHeight * pixelRatio);
      platformerContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    }

    function buildPlatformerLevel() {
      const groundY = platformerHeight - 38;
      platformerWorldWidth = Math.max(2400, platformerWidth * 3);
      platformerPlatforms = [];

      for (let x = 0; x < platformerWorldWidth; x += 600) {
        platformerPlatforms.push({
          x,
          y: groundY,
          width: Math.min(500, platformerWorldWidth - x),
          height: 60,
          ground: true
        });
      }

      const platformHeights = [95, 155, 110, 175, 125, 165];
      let index = 0;
      for (let x = 160; x < platformerWorldWidth - 160; x += 180) {
        platformerPlatforms.push({
          x,
          y: groundY - platformHeights[index % platformHeights.length],
          width: 112,
          height: 16,
          ground: false
        });
        index += 1;
      }
    }

    function resetPlatformerPlayer() {
      platformerPlayer.x = 24;
      platformerPlayer.y = platformerHeight - 38 - platformerPlayer.height;
      platformerPlayer.velocityY = 0;
      platformerPlayer.onGround = true;
      platformerPlayer.checkpointX = 24;
      platformerCameraX = 0;
      platformerWon = false;
      gameKeys.clear();
      jumpQueued = false;
    }

    function startPlatformer() {
      if (!canStartEvent()) return;
      adminPanel.hidden = true;
      adminToggle.setAttribute("aria-expanded", "false");
      platformer.hidden = false;
      platformerActive = true;
      sizePlatformerCanvas();
      buildPlatformerLevel();
      resetPlatformerPlayer();
      platformerLastFrame = 0;
      platformerFrameId = requestAnimationFrame(updatePlatformer);
    }

    function stopPlatformer() {
      platformerActive = false;
      platformer.hidden = true;
      gameKeys.clear();
      cancelAnimationFrame(platformerFrameId);
    }

    function updatePlatformer(timestamp) {
      if (!platformerActive) return;
      const frameScale = platformerLastFrame
        ? Math.min((timestamp - platformerLastFrame) / 16.67, 2)
        : 1;
      platformerLastFrame = timestamp;

      if (!platformerWon) {
        const direction = Number(gameKeys.has("right")) - Number(gameKeys.has("left"));
        platformerPlayer.x += direction * 4.6 * frameScale;
        platformerPlayer.x = Math.max(0, Math.min(
          platformerPlayer.x,
          platformerWorldWidth - platformerPlayer.width
        ));

        if (jumpQueued && platformerPlayer.onGround) {
          platformerPlayer.velocityY = -12;
          platformerPlayer.onGround = false;
        }
        jumpQueued = false;

        const previousBottom = platformerPlayer.y + platformerPlayer.height;
        platformerPlayer.velocityY += 0.58 * frameScale;
        platformerPlayer.y += platformerPlayer.velocityY * frameScale;
        platformerPlayer.onGround = false;

        for (const ledge of platformerPlatforms) {
          const horizontallyOverlaps = platformerPlayer.x + platformerPlayer.width > ledge.x
            && platformerPlayer.x < ledge.x + ledge.width;
          const currentBottom = platformerPlayer.y + platformerPlayer.height;
          if (horizontallyOverlaps && platformerPlayer.velocityY >= 0
              && previousBottom <= ledge.y && currentBottom >= ledge.y) {
            platformerPlayer.y = ledge.y - platformerPlayer.height;
            platformerPlayer.velocityY = 0;
            platformerPlayer.onGround = true;
            if (ledge.ground) platformerPlayer.checkpointX = platformerPlayer.x;
          }
        }

        if (platformerPlayer.y > platformerHeight + 100) {
          platformerPlayer.x = Math.max(24, platformerPlayer.checkpointX - 12);
          platformerPlayer.y = platformerHeight - 38 - platformerPlayer.height;
          platformerPlayer.velocityY = 0;
          platformerPlayer.onGround = true;
        }

        if (platformerPlayer.x + platformerPlayer.width >= platformerWorldWidth - 72) {
          platformerWon = true;
          gameKeys.clear();
        }
      }

      drawPlatformer();
      platformerFrameId = requestAnimationFrame(updatePlatformer);
    }

    function drawPlatformer() {
      const ctx = platformerContext;
      const width = platformerWidth;
      const height = platformerHeight;
      const groundY = height - 38;
      platformerCameraX = Math.max(0, Math.min(
        platformerPlayer.x - width * 0.32,
        platformerWorldWidth - width
      ));

      const sky = ctx.createLinearGradient(0, 0, 0, height);
      sky.addColorStop(0, "#476dc1");
      sky.addColorStop(1, "#b9e7ff");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
      for (let i = 0; i < 9; i += 1) {
        const cloudX = ((i * 287 - platformerCameraX * 0.28) % (width + 180) + width + 180) % (width + 180) - 90;
        const cloudY = 55 + (i % 4) * 48;
        ctx.beginPath();
        ctx.ellipse(cloudX, cloudY, 36, 13, 0, 0, Math.PI * 2);
        ctx.ellipse(cloudX - 20, cloudY + 3, 18, 10, 0, 0, Math.PI * 2);
        ctx.ellipse(cloudX + 18, cloudY + 3, 20, 11, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const ledge of platformerPlatforms) {
        const screenX = ledge.x - platformerCameraX;
        if (screenX + ledge.width < 0 || screenX > width) continue;
        ctx.fillStyle = ledge.ground ? "#80512e" : "#a86f3e";
        ctx.fillRect(screenX, ledge.y, ledge.width, ledge.height);
        ctx.fillStyle = "#58c96b";
        ctx.fillRect(screenX, ledge.y, ledge.width, 7);
      }

      const goalX = platformerWorldWidth - 72 - platformerCameraX;
      ctx.fillStyle = "#493d36";
      ctx.fillRect(goalX, groundY - 90, 5, 90);
      ctx.fillStyle = "#ffdf4f";
      ctx.beginPath();
      ctx.moveTo(goalX + 5, groundY - 88);
      ctx.lineTo(goalX + 48, groundY - 73);
      ctx.lineTo(goalX + 5, groundY - 58);
      ctx.closePath();
      ctx.fill();

      const playerScreenX = platformerPlayer.x - platformerCameraX;
      if (platformerSprite.complete && platformerSprite.naturalWidth) {
        ctx.drawImage(
          platformerSprite,
          playerScreenX,
          platformerPlayer.y,
          platformerPlayer.width,
          platformerPlayer.height
        );
      } else {
        ctx.fillStyle = "#f0a2d4";
        ctx.beginPath();
        ctx.arc(playerScreenX + platformerPlayer.width / 2, platformerPlayer.y + platformerPlayer.height / 2,
          platformerPlayer.width / 2, 0, Math.PI * 2);
        ctx.fill();
      }

      if (platformerWon) {
        ctx.fillStyle = "rgba(10, 20, 45, 0.72)";
        ctx.fillRect(0, 0, width, height);
        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.font = "bold 36px system-ui, sans-serif";
        ctx.fillText("Yay! Meowl made it!", width / 2, height / 2 - 12);
        ctx.font = "18px system-ui, sans-serif";
        ctx.fillText("Tap or click to play again", width / 2, height / 2 + 26);
      }
    }

    function beginAdminCountdown() {
      countdownActive = true;
      const countdownEndsAt = Date.now() + 60000;

      function updateCountdown() {
        const secondsLeft = Math.ceil((countdownEndsAt - Date.now()) / 1000);
        if (secondsLeft <= 0) {
          startAdminEvent();
          return;
        }

        banner.innerText = secondsLeft === 60
          ? "meowl admin abuse in 1 minute"
          : `meowl admin abuse in ${secondsLeft} seconds`;
        countdownTimer = setTimeout(updateCountdown, 1000);
      }

      updateCountdown();
    }

    function addFloatingMeowl(options = {}) {
      const meowl = document.createElement("img");
      const size = options.size ?? 55 + Math.random() * 95;
      const width = Math.round(size);
      const height = Math.round(size * 850 / 770);
      const maxX = Math.max(0, window.innerWidth - width);
      const maxY = Math.max(0, window.innerHeight - height);
      const x = Math.max(0, Math.min(options.x ?? Math.random() * maxX, maxX));
      const y = Math.max(0, Math.min(options.y ?? Math.random() * maxY, maxY));
      meowl.src = "meowl3.png";
      meowl.alt = "";
      meowl.style.width = `${width}px`;
      meowl.style.height = `${height}px`;
      meowl.style.transform = `translate3d(${x}px, ${y}px, 0)`;
      floatingMeowls.appendChild(meowl);

      floatingMeowlMotion.push({
        element: meowl,
        x,
        y,
        width,
        height,
        vx: (Math.random() < 0.5 ? -1 : 1) * (2 + Math.random() * 3),
        vy: (Math.random() < 0.5 ? -1 : 1) * (2 + Math.random() * 3),
        ...(options.velocity || {})
      });
    }

    function moveFloatingMeowls(timestamp) {
      const frameScale = lastAnimationFrame
        ? Math.min((timestamp - lastAnimationFrame) / 16.67, 3)
        : 1;
      lastAnimationFrame = timestamp;

      floatingMeowlMotion.forEach((meowl) => {
        const maxX = Math.max(0, window.innerWidth - meowl.width);
        const maxY = Math.max(0, window.innerHeight - meowl.height);
        meowl.x += meowl.vx * frameScale;
        meowl.y += meowl.vy * frameScale;

        if (meowl.x <= 0 || meowl.x >= maxX) {
          meowl.x = Math.max(0, Math.min(meowl.x, maxX));
          meowl.vx *= -1;
        }
        if (meowl.y <= 0 || meowl.y >= maxY) {
          meowl.y = Math.max(0, Math.min(meowl.y, maxY));
          meowl.vy *= -1;
        }

        meowl.element.style.transform = `translate3d(${meowl.x}px, ${meowl.y}px, 0)`;
      });

      if (discoActive) {
        const collisionsThisFrame = new Set();
        const countAtFrameStart = floatingMeowlMotion.length;
        const cellSize = 256;
        const grid = new Map();

        for (let i = 0; i < countAtFrameStart; i += 1) {
          const meowl = floatingMeowlMotion[i];
          const cellX = Math.floor((meowl.x + meowl.width / 2) / cellSize);
          const cellY = Math.floor((meowl.y + meowl.height / 2) / cellSize);
          const key = `${cellX}:${cellY}`;
          if (!grid.has(key)) grid.set(key, []);
          grid.get(key).push(i);
        }

        for (let i = 0; i < countAtFrameStart; i += 1) {
          const first = floatingMeowlMotion[i];
          const cellX = Math.floor((first.x + first.width / 2) / cellSize);
          const cellY = Math.floor((first.y + first.height / 2) / cellSize);
          for (let neighborX = cellX - 1; neighborX <= cellX + 1; neighborX += 1) {
            for (let neighborY = cellY - 1; neighborY <= cellY + 1; neighborY += 1) {
              const neighbors = grid.get(`${neighborX}:${neighborY}`) || [];
              for (const j of neighbors) {
                if (j <= i) continue;
                const second = floatingMeowlMotion[j];
                const overlaps = Math.abs(first.x + first.width / 2 - second.x - second.width / 2)
                    < (first.width + second.width) / 2
                  && Math.abs(first.y + first.height / 2 - second.y - second.height / 2)
                    < (first.height + second.height) / 2;
                if (!overlaps) continue;

                const pairKey = `${i}:${j}`;
                collisionsThisFrame.add(pairKey);
                if (activeCollisionPairs.has(pairKey)) continue;

                const centerX = (first.x + first.width / 2 + second.x + second.width / 2) / 2;
                const centerY = (first.y + first.height / 2 + second.y + second.height / 2) / 2;
                if (timestamp - lastCollisionBurstAt < 1500) continue;
                lastCollisionBurstAt = timestamp;
                const parentSize = (first.width + second.width) / 2;
                const firstCopyAngle = Math.random() * Math.PI * 2;
                for (let copy = 0; copy < discoCopiesPerCollision; copy += 1) {
                  const size = Math.max(24, Math.min(190, parentSize * (0.55 + Math.random() * 0.9)));
                  const angle = firstCopyAngle + copy * Math.PI * 2 / discoCopiesPerCollision;
                  const speed = 3 + Math.random() * 3;
                  const burstRadius = parentSize * 0.75 + size * 0.75;
                  addFloatingMeowl({
                    x: centerX - size / 2 + Math.cos(angle) * burstRadius,
                    y: centerY - size * 850 / 770 / 2 + Math.sin(angle) * burstRadius,
                    size,
                    velocity: {
                      vx: Math.cos(angle) * speed,
                      vy: Math.sin(angle) * speed
                    }
                  });
                }
              }
            }
          }
        }

        activeCollisionPairs = collisionsThisFrame;
      }

      if (adminEventActive || discoActive) {
        animationFrameId = requestAnimationFrame(moveFloatingMeowls);
      }
    }

    function startAdminEvent() {
      countdownActive = false;
      adminEventActive = true;
      adminAudioWasPlaying = !audio.paused;
      audio.pause();
      adminAudio.currentTime = 0;
      adminAudio.play();
      banner.innerText = "meowl admin abuse!";
      lastAnimationFrame = 0;
      animationFrameId = requestAnimationFrame(moveFloatingMeowls);

      let floatingCount = 0;
      function burst() {
        for (let i = 0; i < 4 && floatingCount < maxFloatingMeowls; i += 1) {
          addFloatingMeowl();
          floatingCount += 1;
        }
        if (floatingCount >= maxFloatingMeowls) clearInterval(spawnTimer);
      }

      burst();
      spawnTimer = setInterval(burst, 700);
      effectTimer = setTimeout(endAdminEvent, 120000);
    }

    function endAdminEvent() {
      clearInterval(spawnTimer);
      cancelAnimationFrame(animationFrameId);
      floatingMeowlMotion = [];
      floatingMeowls.replaceChildren();
      adminAudio.pause();
      adminAudio.currentTime = 0;
      adminEventActive = false;
      showRandomMessage();
      if (adminAudioWasPlaying) audio.play();
    }

    textTimer = setInterval(() => {
      if (countdownActive || adminEventActive || discoActive || platformerActive) return;
      showRandomMessage();
      if (Math.random() < 0.01) beginAdminCountdown();
    }, 5000);
  </script>
</body>
