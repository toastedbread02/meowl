<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meowl</title>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="a170e7cc-cf0a-484f-a5db-dd786746b95e"></script>
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    * {
      -webkit-user-select: none;
      -moz-user-select: none;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body.cracking-open {
      background: #000;
    }

    #meowl-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #status-banner {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 5;
      box-sizing: border-box;
      width: 100%;
      font-size: 24px;
      color: red;
      font-weight: bold;
      padding: 20px;
      text-align: center;
      background: yellow;
    }

    #event-menu {
      position: fixed;
      top: 50%;
      left: 50%;
      z-index: 8;
      display: grid;
      gap: 10px;
      padding: 8px;
      border: 1px solid #777;
      background: white;
      transform: translate(-50%, -50%);
    }

    #event-backdrop {
      position: fixed;
      inset: 0;
      z-index: 7;
      background: rgba(0, 0, 0, 0.65);
    }

    #event-backdrop[hidden] {
      display: none;
    }

    #event-menu[hidden] {
      display: none;
    }

    #event-menu button {
      display: block;
      width: 100%;
    }

    #meowl-image.disco-mode {
      animation: meowl-disco 2s linear infinite;
    }

    #floating-meowls.disco-mode {
      animation: meowl-rainbow 2s linear infinite;
      will-change: filter;
    }

    @keyframes meowl-disco {
      to { filter: hue-rotate(360deg); }
    }

    @keyframes meowl-rainbow {
      to { filter: hue-rotate(360deg); }
    }

    #floating-meowls {
      position: fixed;
      inset: 0;
      z-index: 3;
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #meowl-visitor {
      position: fixed;
      left: 12px;
      bottom: 0;
      z-index: 4;
      display: block;
      width: min(14vw, 120px);
      max-height: 22vh;
      object-fit: contain;
      pointer-events: none;
      transform: translateX(-120%);
      will-change: transform;
    }

    #meowl-visitor[hidden] {
      display: none;
    }

    #meowl-visitor.walking-in {
      animation: meowl-walk-in 1.2s ease-out forwards;
    }

    #meowl-visitor.walking-out {
      animation: meowl-walk-out 1.2s ease-in forwards;
    }

    #crack-lines,
    #crack-shards {
      position: fixed;
      inset: 0;
      z-index: 4;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #crack-lines[hidden],
    #crack-shards[hidden] {
      display: none;
    }

    #crack-lines path {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      transition: stroke-dashoffset 550ms ease-out;
    }

    #crack-lines .crack-shadow {
      stroke: #080808;
      stroke-width: 22;
    }

    #crack-lines .crack-highlight {
      stroke: #fff;
      stroke-width: 6;
      filter: drop-shadow(0 0 5px #fff);
    }

    #rebuild-workers {
      position: fixed;
      inset: 0;
      z-index: 6;
      overflow: hidden;
      pointer-events: none;
    }

    #rebuild-workers[hidden] {
      display: none;
    }

    .rebuild-worker {
      position: absolute;
      bottom: 8px;
      width: 52px;
      height: 58px;
    }

    .worker-ladder {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 0;
      width: 28px;
      background:
        linear-gradient(90deg, transparent 0 3px, #88521f 3px 6px, transparent 6px 22px, #88521f 22px 25px, transparent 25px),
        repeating-linear-gradient(to bottom, transparent 0 17px, #d39a55 17px 20px, transparent 20px 34px);
      filter: drop-shadow(1px 1px 1px #241408);
    }

    .worker-ladder,
    .worker-climber {
      pointer-events: none;
    }

    .worker-climber {
      position: absolute;
      bottom: 8px;
      left: 0;
      z-index: 2;
      width: 52px;
      height: 58px;
      will-change: transform;
    }

    .worker-climber img {
      position: absolute;
      bottom: 0;
      left: 3px;
      width: 46px;
      height: auto;
      animation: worker-bob 0.42s steps(2, end) infinite;
    }

    .worker-hat {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 3;
      width: 23px;
      height: 11px;
      border-radius: 10px 10px 2px 2px;
      background: #ff8a00;
      transform: rotate(-8deg);
    }

    .worker-hat::after {
      position: absolute;
      right: -4px;
      bottom: -2px;
      left: -4px;
      height: 3px;
      border-radius: 3px;
      background: #db6500;
      content: "";
    }

    @keyframes worker-bob {
      50% { transform: translateY(-3px); }
    }

    @keyframes meowl-walk-in {
      0% { transform: translate(-120%, 0); }
      25% { transform: translate(-85%, -5px); }
      50% { transform: translate(-55%, 0); }
      75% { transform: translate(-25%, -5px); }
      100% { transform: translate(0, 0); }
    }

    @keyframes meowl-walk-out {
      0% { transform: translate(0, 0); }
      25% { transform: translate(-25%, -5px); }
      50% { transform: translate(-55%, 0); }
      75% { transform: translate(-85%, -5px); }
      100% { transform: translate(-120%, 0); }
    }

  </style>
</head>

    ];

      }
    }
    let imageResetTimeout;

    let adminCollisionTracked = false;

    audio.addEventListener("playing", () => {

    function resizeFloatingCanvas() {
      const ratio = Math.min(window.devicePixelRatio || 1, 1.5);
      floatingMeowls.width = Math.round(window.innerWidth * ratio);
      floatingMeowls.height = Math.round(window.innerHeight * ratio);
      floatingContext.setTransform(ratio, 0, 0, ratio, 0, 0);

    resizeFloatingCanvas();
    window.addEventListener("resize", resizeFloatingCanvas);

    function countBannerClick() {
      bannerClickCount += 1;

      if (discoActive) endDiscoEvent("interrupted");

      if (adminEventActive) return;

        return;
      }

      if (audio.paused) {
        audio.play();
        return;
      }

      triggerMeowReaction();
    });

    function triggerMeowReaction() {
      image.src = "meowl2.png";
      meowSound.currentTime = 0;
      meowSound.playbackRate = 0.7 + Math.random() * 0.6;
      meowSound.preservesPitch = false;
      meowSound.webkitPreservesPitch = false;
      meowSound.mozPreservesPitch = false;
      meowSound.play();
      clearTimeout(imageResetTimeout);
      imageResetTimeout = setTimeout(() => {
        image.src = "meowl.png";
      }, 300);
    }

    function canStartEvent() {
      return !countdownActive && !discoCountdownActive && !adminEventActive && !discoActive
        && !crackingOpenActive;
    }

    function playCrackSound() {
      crackAudio.currentTime = 0;
      crackAudio.playbackRate = 0.75 + Math.random() * 0.5;
      crackAudio.preservesPitch = false;
      crackAudio.webkitPreservesPitch = false;
      crackAudio.mozPreservesPitch = false;
      const playback = crackAudio.play();
      if (playback && typeof playback.catch === "function") playback.catch(() => {});
    }

    function resetCrackingOpen() {
      if (!crackingOpenActive || crackingStage >= 3) return;
      clearTimeout(crackingIdleTimer);
      clearTimeout(crackTextTimer);
      clearTimeout(crackRebuildStartTimer);
      clearTimeout(crackRebuildTimer);
      cancelAnimationFrame(crackShatterFrame);
      crackShards.hidden = true;
      rebuildWorkers.hidden = true;
      rebuildWorkers.replaceChildren();
      crackContext.clearRect(0, 0, crackShards.width, crackShards.height);
      crackLines.hidden = true;

      crackLines.classList.remove("second-crack");
      for (const path of crackLines.querySelectorAll("path")) {
        path.style.removeProperty("stroke-dasharray");
        path.style.removeProperty("stroke-dashoffset");

      image.src = "meowl.png";
      banner.innerText = crackingOriginalMessage;
      crackPieces = [];
      crackingStage = 0;
      crackingOpenActive = false;
    }

    function restartCrackingIdleTimer() {
      clearTimeout(crackingIdleTimer);
      crackingIdleTimer = setTimeout(resetCrackingOpen, 10000);
    }

    function startCrackingOpen() {
      crackingOpenActive = true;
      crackingOriginalMessage = banner.innerText;
      crackingStage = 1;
      clearTimeout(imageResetTimeout);
      image.src = "crack1.png";
      banner.innerText = "uhmm what";
      trackMeowlEvent("cracking_open");
      playCrackSound();
      restartCrackingIdleTimer();
    }

    function advanceCrackingOpen() {
      crackingStage += 1;
      if (crackingStage === 2) {
        banner.innerText = "okay stop you are litereally somehow breaking the fourth wall";
        image.src = "crack2.png";
        playCrackSound();
      } else {
        banner.innerText = "WHAT HAVE YOU DONE";
        document.body.classList.add("cracking-open");
        image.style.visibility = "hidden";
        prepareRebuildLadders();
        startCrackShatter();
        playCrackSound();
        clearTimeout(crackingIdleTimer);
        crackTextTimer = setTimeout(() => {
          if (crackingOpenActive && crackingStage === 3) banner.innerText = "..";
        }, 1000);
        crackRebuildStartTimer = setTimeout(startCrackRebuild, 20000);
        return;
      }
      restartCrackingIdleTimer();
    }

    function startCrackRebuild() {
      if (!crackingOpenActive || crackingStage !== 3) return;
      if (!rebuildSprite.complete || !rebuildSprite.naturalWidth) {
        rebuildSprite.addEventListener("load", startCrackRebuild, { once: true });
        return;
      }

      crackRebuilding = true;
      crackRebuildStartedAt = performance.now();
      const workerPositions = [8, 27, 47, 67, 87];
      const workerQueues = workerPositions.map(() => []);
      const width = window.innerWidth;
      const height = window.innerHeight;
      for (const piece of crackPieces) {
        const workerIndex = workerPositions.reduce((closestIndex, position, index) => {
          const distance = Math.abs(piece.centerX - width * position / 100);
          const closestDistance = Math.abs(piece.centerX - width * workerPositions[closestIndex] / 100);
          return distance < closestDistance ? index : closestIndex;
        }, 0);
        piece.workerIndex = workerIndex;
        piece.rebuildFromX = piece.dx;
        piece.rebuildFromY = height - piece.height / 2 - piece.centerY;
        piece.rebuildFromRotation = piece.rotation;
        piece.rebuildDuration = 1400;
        workerQueues[workerIndex].push(piece);
      }
      workerQueues.forEach((queue) => {
        queue.sort((a, b) => b.centerY - a.centerY);
      });
      const longestWorkerQueue = Math.max(...workerQueues.map((queue) => queue.length));
      const workCycle = 59500 / longestWorkerQueue;
      const climbDuration = workCycle / 2 - 10;
      workerQueues.forEach((queue) => {
        queue.forEach((piece, order) => {
          piece.rebuildDelay = order * workCycle;
          piece.rebuildDuration = climbDuration;
          piece.dx = piece.rebuildFromX;
          piece.dy = piece.rebuildFromY;
          piece.rotation = piece.rebuildFromRotation;
        });

      prepareRebuildLadders();
      workerPositions.forEach((position, index) => {

        imageElement.addEventListener("load", positionHat, { once: true });

      rebuildWorkers.hidden = false;
      crackShards.hidden = false;
      lastCrackFrame = 0;

    function prepareRebuildLadders() {
      if (rebuildWorkers.children.length) {
        rebuildWorkers.hidden = false;

      }
      for (const position of [8, 27, 47, 67, 87]) {

      if (!crackingOpenActive || !crackRebuilding) return;
      clearTimeout(crackRebuildTimer);
      cancelAnimationFrame(crackShatterFrame);
      crackRebuilding = false;
      crackShards.hidden = true;

      image.src = "meowl.png";
      banner.innerText = crackingOriginalMessage;

    function startCrackShatter() {
      if (!crackSprite.complete || !crackSprite.naturalWidth) {

      const rows = 6;

      const vertices = [];
      const jaggedEdges = new Map();

          const topRight = vertices[row][column + 1];
          const bottomRight = vertices[row + 1][column + 1];
          const bottomLeft = vertices[row + 1][column];
          const triangles = Math.random() < 0.5

          for (const points of triangles) {

            for (let edgeIndex = 0; edgeIndex < points.length; edgeIndex += 1) {

              const end = points[(edgeIndex + 1) % points.length];
              const edgeKey = `${Math.min(start.id, end.id)}:${Math.max(start.id, end.id)}`;
              if (!jaggedEdges.has(edgeKey)) {
                const forward = start.id < end.id;
                const first = forward ? start : end;
                const last = forward ? end : start;
                const dx = last.x - first.x;
                const dy = last.y - first.y;
                const length = Math.hypot(dx, dy) || 1;
                const edgePoints = [first];
                for (let step = 1; step <= 3; step += 1) {
                  const progress = step / 4;
                  const jaggedness = (Math.random() - 0.5) * 14;
                  edgePoints.push({
                    x: first.x + dx * progress - dy / length * jaggedness,
                    y: first.y + dy * progress + dx / length * jaggedness
                  });
                }
                edgePoints.push(last);
                jaggedEdges.set(edgeKey, edgePoints);
              }
              const edgePoints = jaggedEdges.get(edgeKey);
              const orderedPoints = start.id < end.id ? edgePoints : edgePoints.slice().reverse();
              polygon.push(...orderedPoints.slice(0, -1));
            }

            const centerX = polygon.reduce((sum, point) => sum + point.x, 0) / polygon.length;
            const centerY = polygon.reduce((sum, point) => sum + point.y, 0) / polygon.length;
            const minX = Math.min(...polygon.map((point) => point.x));
            const maxX = Math.max(...polygon.map((point) => point.x));
            const minY = Math.min(...polygon.map((point) => point.y));
            const maxY = Math.max(...polygon.map((point) => point.y));
            crackPieces.push({
              points: polygon,
              centerX,
              centerY,
              minX,
              minY,
              width: maxX - minX,
              height: maxY - minY,
              sx: sourceX + minX / scale,
              sy: sourceY + minY / scale,
              sw: (maxX - minX) / scale,
              sh: (maxY - minY) / scale,
              dx: 0,
              dy: 0,
              vx: (Math.random() - 0.5) * 3,
              vy: 0.5 + Math.random() * 1.8,
              rotation: 0,
              rotationSpeed: (Math.random() - 0.5) * 0.07
            });
          }
        }
      }

      lastCrackFrame = 0;
      crackShatterFrame = requestAnimationFrame(moveCrackShards);
    }

    function moveCrackShards(timestamp) {
      const width = window.innerWidth;
      const height = window.innerHeight;
      const rebuildingFor = crackRebuilding ? timestamp - crackRebuildStartedAt : 0;
      const frameScale = lastCrackFrame
        ? Math.min((timestamp - lastCrackFrame) / 16.67, 3)
        : 1;
      lastCrackFrame = timestamp;
      crackContext.clearRect(0, 0, width, height);
      crackContext.strokeStyle = "rgba(0, 0, 0, 0.9)";
      crackContext.lineWidth = 1.5;
      let piecesRemain = false;

      if (crackRebuilding) {
        for (const worker of rebuildWorkers.children) {
          worker.querySelector(".worker-climber").style.transform = "translateY(0px)";
        }
        for (const piece of crackPieces) {
          const pieceElapsed = rebuildingFor - piece.rebuildDelay;
          if (pieceElapsed < 0 || pieceElapsed >= piece.rebuildDuration * 2) continue;
          const climber = rebuildWorkers.children[piece.workerIndex]?.querySelector(".worker-climber");
          if (!climber) continue;
          const targetWorkerY = piece.centerY - (height - 45);
          if (pieceElapsed < piece.rebuildDuration) {
            const progress = pieceElapsed / piece.rebuildDuration;
            const eased = progress * progress * (3 - 2 * progress);
            climber.style.transform = `translateY(${targetWorkerY * eased}px)`;
          } else {
            const progress = (pieceElapsed - piece.rebuildDuration) / piece.rebuildDuration;
            const eased = progress * progress * (3 - 2 * progress);
            climber.style.transform = `translateY(${targetWorkerY * (1 - eased)}px)`;
          }
        }
      }

      for (const piece of crackPieces) {
        if (crackRebuilding) {
          const pieceElapsed = rebuildingFor - piece.rebuildDelay;
          const climbProgress = Math.max(0, Math.min(1, pieceElapsed / piece.rebuildDuration));
          const eased = climbProgress * climbProgress * (3 - 2 * climbProgress);
          if (pieceElapsed < piece.rebuildDuration) {
            piece.dx = piece.rebuildFromX * (1 - eased);
            piece.dy = piece.rebuildFromY * (1 - eased);
            piece.rotation = piece.rebuildFromRotation * (1 - eased);
            piecesRemain = true;
          } else {
            piece.dx = 0;
            piece.dy = 0;
            piece.rotation = 0;
          }
          if (pieceElapsed < piece.rebuildDuration * 2) piecesRemain = true;
        } else {
          piece.dx += piece.vx * frameScale;
          piece.vy += 0.17 * frameScale;
          piece.dy += piece.vy * frameScale;
          piece.rotation += piece.rotationSpeed * frameScale;
          if (piece.centerY + piece.dy < height + piece.height) piecesRemain = true;
        }

        crackContext.save();
        crackContext.translate(piece.centerX + piece.dx, piece.centerY + piece.dy);
        crackContext.rotate(piece.rotation);
        crackContext.beginPath();
        piece.points.forEach((point, index) => {
          const x = point.x - piece.centerX;
          const y = point.y - piece.centerY;
          if (index === 0) crackContext.moveTo(x, y);
          else crackContext.lineTo(x, y);
        });
        crackContext.closePath();
        crackContext.clip();
        crackContext.drawImage(
          crackRebuilding ? rebuildSprite : crackSprite,
          piece.sx, piece.sy, piece.sw, piece.sh,
          piece.minX - piece.centerX, piece.minY - piece.centerY,
          piece.width, piece.height
        );
        crackContext.restore();
      }

      if (crackRebuilding) {
        crackContext.save();
        crackContext.lineCap = "round";
        for (const piece of crackPieces) {
          const pieceElapsed = rebuildingFor - piece.rebuildDelay;
          if (pieceElapsed < 0 || pieceElapsed >= piece.rebuildDuration) continue;
          const worker = rebuildWorkers.children[piece.workerIndex];
          const climber = worker?.querySelector(".worker-climber");
          if (!climber) continue;
          const workerRect = climber.getBoundingClientRect();
          const startX = workerRect.left + workerRect.width / 2;
          const startY = workerRect.top + workerRect.height / 2;
          const endX = piece.centerX + piece.dx;
          const endY = piece.centerY + piece.dy;
          crackContext.strokeStyle = "#613b1c";
          crackContext.lineWidth = 3;
          crackContext.beginPath();
          crackContext.moveTo(startX, startY);
          crackContext.lineTo(endX, endY);
          crackContext.stroke();
          crackContext.strokeStyle = "#e7b66d";
          crackContext.lineWidth = 1;
          crackContext.stroke();
        }
        crackContext.restore();
      }

      if (crackRebuilding && rebuildingFor >= 60000) {
        finishCrackRebuild();
      } else if (crackRebuilding && crackingOpenActive) {
        crackShatterFrame = requestAnimationFrame(moveCrackShards);
      } else if (piecesRemain && crackingOpenActive) {
        crackShatterFrame = requestAnimationFrame(moveCrackShards);
      } else {
        crackShards.hidden = true;
      }
    }

    function showMeowlVisitor() {
      if (meowlVisitActive) return;
      meowlVisitActive = true;
      trackMeowlEvent("meowl_peek");
      meowlVisitor.hidden = false;
      meowlVisitor.classList.add("walking-in");

      const stareDuration = 30000 + Math.random() * 30000;
      setTimeout(() => {
        meowlVisitor.classList.remove("walking-in");
        meowlVisitor.classList.add("walking-out");
        setTimeout(() => {
          meowlVisitor.hidden = true;
          meowlVisitor.classList.remove("walking-out");
          meowlVisitActive = false;
        }, 1200);
      }, 1200 + stareDuration);
    }

    function startDiscoEvent(trigger) {
      if (!canStartEvent()) return;
      discoActive = true;
      discoTrigger = trigger;
      trackMeowlEvent("disco_started", { trigger });
      discoAudio.currentTime = 0;
      discoAudio.play();
      discoRainbowDelay = `${-(performance.now() % 2000)}ms`;
      image.classList.add("disco-mode");
      image.style.animationDelay = discoRainbowDelay;
      floatingMeowls.classList.add("disco-mode");
      floatingMeowls.style.animationDelay = discoRainbowDelay;
      banner.innerText = "meowl disco mode!";
      floatingContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
      floatingMeowlMotion = [];
      activeCollisionPairs.clear();
      lastCollisionBurstAt = -Infinity;
      lastCollisionCheckAt = -Infinity;
      for (let i = 0; i < 2; i += 1) addFloatingMeowl();
      lastAnimationFrame = 0;
      animationFrameId = requestAnimationFrame(moveFloatingMeowls);
      discoTimer = setTimeout(() => endDiscoEvent("duration_elapsed"), 20000);
    }

    function endDiscoEvent(endReason) {
      if (!discoActive) return;
      clearTimeout(discoTimer);
      image.classList.remove("disco-mode");
      image.style.removeProperty("animation-delay");
      floatingMeowls.classList.remove("disco-mode");
      floatingMeowls.style.removeProperty("animation-delay");
      discoActive = false;
      trackMeowlEvent("disco_ended", {
        trigger: discoTrigger,
        end_reason: endReason
      });
      discoTrigger = null;
      cancelAnimationFrame(animationFrameId);
      floatingMeowlMotion = [];
      activeCollisionPairs.clear();
      floatingContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
      discoAudio.pause();
      discoAudio.currentTime = 0;
      showRandomMessage();
    }

    function showRandomMessage() {
      let message;
      do {
        message = rotatingMessages[Math.floor(Math.random() * rotatingMessages.length)];
      } while (message === lastMessage);

      lastMessage = message;
      banner.innerText = message;
      if (Math.random() < 0.25) showMeowlVisitor();
    }

    function beginAdminCountdown() {
      countdownActive = true;
      const countdownEndsAt = Date.now() + 60000;

      function updateCountdown() {
        const secondsLeft = Math.ceil((countdownEndsAt - Date.now()) / 1000);
        if (secondsLeft <= 0) {
          startAdminEvent("countdown");
          return;
        }

        banner.innerText = secondsLeft === 60
          ? "meowl admin abuse in 1 minute"
          : `meowl admin abuse in ${secondsLeft} seconds`;
        countdownTimer = setTimeout(updateCountdown, 1000);
      }

      updateCountdown();
    }

    function beginDiscoCountdown() {
      discoCountdownActive = true;
      const countdownEndsAt = Date.now() + 60000;

      function updateCountdown() {
        const secondsLeft = Math.ceil((countdownEndsAt - Date.now()) / 1000);
        if (secondsLeft <= 0) {
          discoCountdownActive = false;
          startDiscoEvent("countdown");
          return;
        }

        banner.innerText = secondsLeft === 60
          ? "disco in 1 minute"
          : `disco in ${secondsLeft} seconds`;
        countdownTimer = setTimeout(updateCountdown, 1000);
      }

      updateCountdown();
    }

    function addFloatingMeowl(options = {}) {
      const size = options.size ?? 55 + Math.random() * 95;
      const width = Math.round(size);
      const height = Math.round(size * 850 / 770);
      const maxX = Math.max(0, window.innerWidth - width);
      const maxY = Math.max(0, window.innerHeight - height);
      const x = Math.max(0, Math.min(options.x ?? Math.random() * maxX, maxX));
      const y = Math.max(0, Math.min(options.y ?? Math.random() * maxY, maxY));
      floatingMeowlMotion.push({
        x,
        y,
        width,
        height,
        vx: (Math.random() < 0.5 ? -1 : 1) * (2 + Math.random() * 3),
        vy: (Math.random() < 0.5 ? -1 : 1) * (2 + Math.random() * 3),
        ...(options.velocity || {})
      });
    }

    function moveFloatingMeowls(timestamp) {
      const motionCount = floatingMeowlMotion.length;
      const frameInterval = motionCount > 5000 ? 1000 / 15 : motionCount > 1000 ? 1000 / 30 : 0;
      if (frameInterval && timestamp - lastAnimationFrame < frameInterval) {
        animationFrameId = requestAnimationFrame(moveFloatingMeowls);
        return;
      }
      const frameScale = lastAnimationFrame
        ? Math.min((timestamp - lastAnimationFrame) / 16.67, 5)
        : 1;
      lastAnimationFrame = timestamp;

      let firstCollisionFrame = false;
      if (adminEventActive && adminCollisionPlan) {
        const elapsed = Math.min(adminAudio.currentTime, adminCollisionPlan.collisionTime);
        const progress = elapsed / adminCollisionPlan.collisionTime;
        const first = floatingMeowlMotion[0];
        const second = floatingMeowlMotion[1];

        if (first && second) {
          first.x = adminCollisionPlan.firstStartX
            + (adminCollisionPlan.firstTargetX - adminCollisionPlan.firstStartX) * progress
            - first.width / 2;
          second.x = adminCollisionPlan.secondStartX
            + (adminCollisionPlan.secondTargetX - adminCollisionPlan.secondStartX) * progress
            - second.width / 2;
          first.y = adminCollisionPlan.firstStartY
            + (adminCollisionPlan.firstTargetY - adminCollisionPlan.firstStartY) * progress
            - first.height / 2;
          second.y = adminCollisionPlan.secondStartY
            + (adminCollisionPlan.secondTargetY - adminCollisionPlan.secondStartY) * progress
            - second.height / 2;

          if (adminAudio.currentTime >= adminCollisionPlan.collisionTime) {
            first.vx = adminCollisionPlan.firstVx;
            first.vy = adminCollisionPlan.firstVy;
            second.vx = adminCollisionPlan.secondVx;
            second.vy = adminCollisionPlan.secondVy;
            adminFirstCollisionTriggered = true;
            adminCollisionPlan = null;
            firstCollisionFrame = true;
            spawnTimer = setInterval(spawnAdminImageBatch, 700);
          }
        }
      }

      for (let i = 0; i < motionCount; i += 1) {
        const meowl = floatingMeowlMotion[i];
        if (adminCollisionPlan && i < 2) continue;
        if (firstCollisionFrame && i < 2) continue;
        const maxX = Math.max(0, window.innerWidth - meowl.width);
        const maxY = Math.max(0, window.innerHeight - meowl.height);
        meowl.x += meowl.vx * frameScale;
        meowl.y += meowl.vy * frameScale;

        if (meowl.x <= 0 || meowl.x >= maxX) {
          meowl.x = Math.max(0, Math.min(meowl.x, maxX));
          meowl.vx *= -1;
        }
        if (meowl.y <= 0 || meowl.y >= maxY) {
          meowl.y = Math.max(0, Math.min(meowl.y, maxY));
          meowl.vy *= -1;
        }

      }

      floatingContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
      if (floatingSprite.complete && floatingSprite.naturalWidth) {
        for (const meowl of floatingMeowlMotion) {
          floatingContext.drawImage(floatingSprite, meowl.x, meowl.y, meowl.width, meowl.height);
        }
      }

      if ((discoActive || (adminEventActive && adminFirstCollisionTriggered))
          && timestamp - lastCollisionCheckAt >= 100) {
        lastCollisionCheckAt = timestamp;
        const collisionsThisFrame = new Set();
        const countAtFrameStart = floatingMeowlMotion.length;
        const cellSize = 256;
        const grid = new Map();

        for (let i = 0; i < countAtFrameStart; i += 1) {
          const meowl = floatingMeowlMotion[i];
          const cellX = Math.floor((meowl.x + meowl.width / 2) / cellSize);
          const cellY = Math.floor((meowl.y + meowl.height / 2) / cellSize);
          const key = `${cellX}:${cellY}`;
          if (!grid.has(key)) grid.set(key, []);
          grid.get(key).push(i);
        }

        for (let i = 0; i < countAtFrameStart; i += 1) {
          const first = floatingMeowlMotion[i];
          const cellX = Math.floor((first.x + first.width / 2) / cellSize);
          const cellY = Math.floor((first.y + first.height / 2) / cellSize);
          for (let neighborX = cellX - 1; neighborX <= cellX + 1; neighborX += 1) {
            for (let neighborY = cellY - 1; neighborY <= cellY + 1; neighborY += 1) {
              const neighbors = grid.get(`${neighborX}:${neighborY}`) || [];
              for (const j of neighbors) {
                if (j <= i) continue;
                const second = floatingMeowlMotion[j];
                const overlaps = Math.abs(first.x + first.width / 2 - second.x - second.width / 2)
                    < (first.width + second.width) / 2
                  && Math.abs(first.y + first.height / 2 - second.y - second.height / 2)
                    < (first.height + second.height) / 2;
                if (!overlaps) continue;

                const pairKey = `${i}:${j}`;
                collisionsThisFrame.add(pairKey);
                if (activeCollisionPairs.has(pairKey)) continue;

                const centerX = (first.x + first.width / 2 + second.x + second.width / 2) / 2;
                const centerY = (first.y + first.height / 2 + second.y + second.height / 2) / 2;
                const parentSize = (first.width + second.width) / 2;
                if (discoActive) {
                  if (timestamp - lastCollisionBurstAt < discoBatchCooldown) continue;
                  lastCollisionBurstAt = timestamp;
                  const firstCopyAngle = Math.random() * Math.PI * 2;
                  for (let copy = 0; copy < discoCopiesPerCollision; copy += 1) {
                    const size = Math.max(24, Math.min(190, parentSize * (0.55 + Math.random() * 0.9)));
                    const angle = firstCopyAngle + copy * Math.PI * 2 / discoCopiesPerCollision;
                    const speed = 3 + Math.random() * 3;
                    const burstRadius = parentSize * 0.75 + size * 0.75;
                    addFloatingMeowl({
                      x: centerX - size / 2 + Math.cos(angle) * burstRadius,
                      y: centerY - size * 850 / 770 / 2 + Math.sin(angle) * burstRadius,
                      size,
                      velocity: {
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed
                      }
                    });
                  }
                } else if (adminEventActive) {
                  if (adminFirstCollisionTriggered) {
                    if (!adminCollisionTracked) {
                      trackMeowlEvent("admin_collision", { collision: true });
                      adminCollisionTracked = true;
                    }
                    spawnAdminCollisionImages(first, second);
                  }
                }
              }
            }
          }
        }

        activeCollisionPairs = collisionsThisFrame;
      }

      if (adminEventActive || discoActive) {
        animationFrameId = requestAnimationFrame(moveFloatingMeowls);
      }
    }

    function spawnAdminCollisionImages(first, second) {
      const copiesToAdd = Math.min(2, maxFloatingMeowls - floatingMeowlMotion.length);
      const centerX = (first.x + first.width / 2 + second.x + second.width / 2) / 2;
      const centerY = (first.y + first.height / 2 + second.y + second.height / 2) / 2;
      const parentSize = (first.width + second.width) / 2;
      const firstCopyAngle = Math.random() * Math.PI * 2;

      for (let copy = 0; copy < copiesToAdd; copy += 1) {
        const size = Math.max(36, Math.min(150, parentSize * (0.65 + Math.random() * 0.55)));
        const angle = firstCopyAngle + copy * Math.PI;
        const speed = 7 + Math.random() * 5;
        const burstRadius = parentSize * 0.6 + size * 0.35;
        addFloatingMeowl({
          x: centerX - size / 2 + Math.cos(angle) * burstRadius,
          y: centerY - size * 850 / 770 / 2 + Math.sin(angle) * burstRadius,
          size,
          velocity: {
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed
          }
        });
      }
    }

    function createAdminCollisionPlan() {
      const size = 80;
      const collisionTime = adminFirstCollisionBaseTime
        + adminCollisionDelayMin
        + Math.random() * (adminCollisionDelayMax - adminCollisionDelayMin);
      const halfWidth = size / 2;
      const halfHeight = size * 850 / 770 / 2;
      const targetX = window.innerWidth * (0.4 + Math.random() * 0.2);
      const targetY = window.innerHeight * (0.4 + Math.random() * 0.2);
      const angle = Math.random() * Math.PI * 2;
      const directionX = Math.cos(angle);
      const directionY = Math.sin(angle);
      const leftBound = halfWidth;
      const rightBound = window.innerWidth - halfWidth;
      const topBound = halfHeight;
      const bottomBound = window.innerHeight - halfHeight;
      const contactDistances = [
        Math.abs(directionX) > 0.0001 ? size / Math.abs(directionX) : Infinity,
        Math.abs(directionY) > 0.0001 ? halfHeight * 2 / Math.abs(directionY) : Infinity
      ];
      const boxContactDistance = Math.min(...contactDistances);

      function distanceToEdge(dx, dy) {
        const distances = [];
        if (dx > 0) distances.push((rightBound - targetX) / dx);
        else if (dx < 0) distances.push((leftBound - targetX) / dx);
        if (dy > 0) distances.push((bottomBound - targetY) / dy);
        else if (dy < 0) distances.push((topBound - targetY) / dy);
        return Math.min(...distances.filter((distance) => distance >= 0));
      }

      const negativeLimit = distanceToEdge(-directionX, -directionY);
      const positiveLimit = distanceToEdge(directionX, directionY);
      const maxStartDistance = Math.max(0,
        Math.min(negativeLimit, positiveLimit) - boxContactDistance / 2);
      const minStartDistance = maxStartDistance * (0.45 + Math.random() * 0.25);
      const firstDistance = minStartDistance + Math.random() * (maxStartDistance - minStartDistance);
      const secondDistance = minStartDistance + Math.random() * (maxStartDistance - minStartDistance);
      const contactGap = boxContactDistance - Math.min(4, Math.max(1, (firstDistance + secondDistance)
        / (collisionTime * 60) * 0.6));
      const firstTargetX = targetX - directionX * contactGap / 2;
      const firstTargetY = targetY - directionY * contactGap / 2;
      const secondTargetX = targetX + directionX * contactGap / 2;
      const secondTargetY = targetY + directionY * contactGap / 2;
      const firstStartX = targetX - directionX * (contactGap / 2 + firstDistance);
      const firstStartY = targetY - directionY * (contactGap / 2 + firstDistance);
      const secondStartX = targetX + directionX * (contactGap / 2 + secondDistance);
      const secondStartY = targetY + directionY * (contactGap / 2 + secondDistance);
      const frameCount = collisionTime * 60;

      return {
        size,
        collisionTime,
        firstStartX,
        firstStartY,
        secondStartX,
        secondStartY,
        firstTargetX,
        firstTargetY,
        secondTargetX,
        secondTargetY,
        firstVx: (firstTargetX - firstStartX) / frameCount,
        firstVy: (firstTargetY - firstStartY) / frameCount,
        secondVx: (secondTargetX - secondStartX) / frameCount,
        secondVy: (secondTargetY - secondStartY) / frameCount
      };
    }

    function startAdminEvent(trigger) {
      countdownActive = false;
      adminEventActive = true;
      trackMeowlEvent("admin_event_started", { trigger });
      adminAudioWasPlaying = !audio.paused;
      audio.pause();
      adminAudio.currentTime = 0;
      adminAudio.play();
      banner.innerText = "meowl admin abuse!";
      lastAnimationFrame = 0;
      lastCollisionCheckAt = -Infinity;
      activeCollisionPairs.clear();
      adminFirstCollisionTriggered = false;
      adminCollisionTracked = false;
      adminCollisionPlan = createAdminCollisionPlan();
      addFloatingMeowl({
        x: adminCollisionPlan.firstStartX - adminCollisionPlan.size / 2,
        y: adminCollisionPlan.firstStartY - adminCollisionPlan.size * 850 / 770 / 2,
        size: adminCollisionPlan.size,
        velocity: { vx: adminCollisionPlan.firstVx, vy: adminCollisionPlan.firstVy }
      });
      addFloatingMeowl({
        x: adminCollisionPlan.secondStartX - adminCollisionPlan.size / 2,
        y: adminCollisionPlan.secondStartY - adminCollisionPlan.size * 850 / 770 / 2,
        size: adminCollisionPlan.size,
        velocity: { vx: adminCollisionPlan.secondVx, vy: adminCollisionPlan.secondVy }
      });
      animationFrameId = requestAnimationFrame(moveFloatingMeowls);
      effectTimer = setTimeout(endAdminEvent, 120000);
    }

    function spawnAdminImageBatch() {
      for (let i = 0; i < 4 && floatingMeowlMotion.length < maxFloatingMeowls; i += 1) {
        addFloatingMeowl();
      }
      if (floatingMeowlMotion.length >= maxFloatingMeowls) clearInterval(spawnTimer);
    }

    function endAdminEvent() {
      clearInterval(spawnTimer);
      clearTimeout(effectTimer);
      cancelAnimationFrame(animationFrameId);
      adminCollisionPlan = null;
      adminFirstCollisionTriggered = false;
      adminCollisionTracked = false;
      floatingMeowlMotion = [];
      floatingContext.clearRect(0, 0, window.innerWidth, window.innerHeight);
      adminAudio.pause();
      adminAudio.currentTime = 0;
      adminEventActive = false;
      showRandomMessage();
      if (adminAudioWasPlaying) audio.play();
    }

    textTimer = setInterval(() => {
      if (countdownActive || discoCountdownActive || adminEventActive || discoActive || crackingOpenActive) return;
      showRandomMessage();
      const chance = Math.random();
      if (chance < 0.01) beginAdminCountdown();
      else if (chance < 0.02) beginDiscoCountdown();
    }, 5000);
  </script>
