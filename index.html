<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meowl</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

  </style>
</head>
<body>
  <img id="meowl-image" src="meowl.png" alt="Meowl">
  <audio id="meowl-audio" src="meowl.mp3" loop></audio>
  <script>
    const audio = document.getElementById("meowl-audio");
    document.getElementById("meowl-image").addEventListener("click", () => {
      audio.play();
    });
  </script>
</body>
</html>
