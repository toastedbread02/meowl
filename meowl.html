<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meowl</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    audio {
      position: fixed;
      right: 1rem;
      bottom: 1rem;
      z-index: 1;
    }
  </style>
</head>
<body>
  <img src="meowl.png" alt="Meowl">
  <audio src="meowl.mp3" autoplay loop controls></audio>
</body>
</html>
